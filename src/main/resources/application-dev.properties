# Enable H2 console only in dev
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Do NOT allow remote browsers by default
spring.h2.console.settings.web-allow-others=false

# (Optional) expose more actuator endpoints only during dev
management.endpoints.web.exposure.include=health,info,env,beans


# Run with the dev profile when you’re debugging locally:

# Maven
# ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev

# or jar
# java -jar target/spring-petclinic-*.jar --spring.profiles.active=dev
# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Internationalization
spring.messages.basename=messages/messages

# Actuator - expose only safe endpoints by default
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h

# Session management (timeout & hardening)
# 15-minute idle timeout
server.servlet.session.timeout=15m

# Stricter cookies; enable 'secure' when using HTTPS
server.servlet.session.cookie.http-only=true
# server.servlet.session.cookie.secure=true

# H2 console: DISABLED by default (prod/safe)
spring.h2.console.enabled=false

# --------------------------------------------------------------------
# ✅ Default Spring Security user (for dev/test login)
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN


